services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lesson_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports: ["5432:5432"]
    volumes: ["planner_data:/var/lib/postgresql/data", "./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"]
volumes:
  planner_data:
